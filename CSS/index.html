<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cascading style sheet</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        h1{
            background-color: rgb(88, 233, 233);
        }
        p{
             font-style : italic;
             font-family: Arial, Helvetica, sans-serif;
             font-size: 25px;
             font-weight: bold;
             text-decoration: underline;
        }
        .link{
            color:black;
            text-decoration: none;
        }
        *{ background-color: rgb(245, 245, 134);
            color:rgb(74, 74, 153);
        }
        h1,p,a{
            color:darkgreen;
        }
        
    </style>
</head>
<body>
    <h1 style="color: greenyellow">HEADING</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Possimus ipsum itaque nihil. Ratione quis voluptate amet facilis. Tempora beatae maiores, tempore voluptas alias, nemo nobis quam autem deserunt nulla sapiente!</p>
    <a class ="link"  href="">linkedin</a>
</body>
   
</html>
